# Nginx 设备识别测试配置（Windows 本地）
# 使用方法：
# 1. 安装 Nginx: http://nginx.org/en/download.html
# 2. 将此文件复制到 nginx/conf/ 目录
# 3. 修改路径为实际路径
# 4. 启动 Nginx: start nginx
# 5. 访问 http://localhost:80

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # 日志配置
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log logs/access.log main;
    error_log logs/error.log;

    # 设备类型映射
    map $http_user_agent $device_type {
        default pc;
        ~*(android|iphone|ipad|ipod|windows\s+phone|mobile|mobi) mobile;
        ~*(ipad|android(?!.*mobile)|tablet) tablet;
    }

    # 前端服务器
    server {
        listen 80;
        server_name localhost;

        # 根路径 - 根据设备自动分发
        location = / {
            # 平板和移动端去移动端
            if ($device_type ~ (mobile|tablet)) {
                return 302 /mobile$is_args$args;
            }
            # PC 去 PC 端
            return 302 /pc$is_args$args;
        }

        # PC 端
        location /pc {
            alias C:/Users/42655/Desktop/P1/apps/pc/dist;  # 修改为你的实际路径
            index index.html;
            try_files $uri $uri/ /pc/index.html;
        }

        # 移动端
        location /mobile {
            alias C:/Users/42655/Desktop/P1/apps/mobile/dist;  # 修改为你的实际路径
            index index.html;
            try_files $uri $uri/ /mobile/index.html;
        }

        # API 转发
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Device-Type $device_type;
        }
    }
}
