<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="新闻资讯平台 - PC端" />
    <title>环球新闻中心 - PC端</title>
    <!-- 设备识别：如果是移动端，提示跳转到移动端 -->
    <script>
      (function() {
        // 检测是否为移动设备
        var ua = navigator.userAgent.toLowerCase();
        var isMobile = /android|iphone|ipad|ipod|windows phone|mobile|mobi/.test(ua);
        var isTablet = /ipad|android(?!.*mobile)|tablet/.test(ua);
        
        // 如果是移动设备且当前不是强制 PC 端模式
        if ((isMobile || isTablet) && !window.location.search.includes('force=pc')) {
          // 检查是否已在移动端路径
          if (!window.location.pathname.startsWith('/mobile')) {
            // 跳转到移动端（假设移动端在 /mobile 路径）
            var mobileUrl = '/mobile' + window.location.pathname + window.location.search;
            // 如果配置了子域名，可以跳转到子域名
            // var mobileUrl = 'https://m.news.example.com' + window.location.pathname;
            console.log('移动设备检测到，建议访问移动端:', mobileUrl);
            // 取消注释以下行以启用自动跳转
            // window.location.href = mobileUrl;
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
