# Nginx 配置文件 - 设备识别与路由分发
# 
# 功能说明：
# 1. 根据 User-Agent 自动识别设备类型（PC/移动端）
# 2. 自动分发到对应的视图（PC端/移动端）
# 3. API 请求统一转发到后端服务
#
# 使用方法：
# 1. 将此文件复制到 Nginx 配置目录（如 /etc/nginx/conf.d/）
# 2. 修改 root 路径为实际的构建输出目录
# 3. 重启 Nginx

server {
    listen 80;
    listen [::]:80;
    server_name news.example.com localhost;

    # 日志配置
    access_log /var/log/nginx/news-platform-access.log;
    error_log /var/log/nginx/news-platform-error.log;

    # 判断设备类型的映射
    map $http_user_agent $is_mobile {
        default 0;
        ~*(android|iphone|ipad|ipod|windows\s+phone|mobile|mobi) 1;
    }

    # API 接口 - 统一转发到后端（两端共用同一套后端接口）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 处理 CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        
        # 处理预检请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # 移动端静态资源
    location /mobile-static/ {
        alias /path/to/apps/mobile/dist/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # PC端静态资源
    location /pc-static/ {
        alias /path/to/apps/pc/dist/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # 移动端入口
    location /mobile {
        alias /path/to/apps/mobile/dist;
        index index.html;
        try_files $uri $uri/ /mobile/index.html;
        
        # 禁用缓存 HTML（SPA 需要）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # PC端入口
    location /pc {
        alias /path/to/apps/pc/dist;
        index index.html;
        try_files $uri $uri/ /pc/index.html;
        
        # 禁用缓存 HTML（SPA 需要）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 根路径 - 根据设备类型自动重定向
    location = / {
        if ($is_mobile) {
            return 302 /mobile$is_args$args;
        }
        return 302 /pc$is_args$args;
    }

    # 默认所有请求根据设备类型分发
    location / {
        # 如果是移动端设备，重定向到移动端
        if ($is_mobile) {
            return 302 /mobile$request_uri;
        }
        
        # PC端
        alias /path/to/apps/pc/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 禁用缓存 HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 错误页面
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

